name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 193.203.176.109
          port: 65002
          username: u395517514
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          command_timeout: 20m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            DEPLOY_DIR=~/domains/lightgrey-cassowary-624705.hostingersite.com/nodejs
            cd $DEPLOY_DIR

            # Init git if not already
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/danial96/softcube_crm.git
            fi

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Install & build
            npm ci
            NODE_OPTIONS="--max-old-space-size=4096" npm run build
